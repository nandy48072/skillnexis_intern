<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App - OpenWeatherMap API</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- Container Card -->
    <div class="w-full max-w-md bg-slate-800/90 backdrop-blur-md border border-slate-700/60 rounded-3xl shadow-2xl p-6 sm:p-8 transition-all duration-300">
        
        <!-- App Title Header -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-white flex items-center justify-center gap-2">
                <i class="fa-solid fa-cloud-sun text-amber-400"></i> Weather App
            </h1>
            <p class="text-xs text-slate-400 mt-1">Week 3 Assignment — OpenWeatherMap API</p>
        </div>

        <!-- Search Form -->
        <form id="searchForm" class="flex gap-2 mb-6" onsubmit="handleSearch(event)">
            <div class="relative w-full">
                <input 
                    type="text" 
                    id="cityInput" 
                    placeholder="Enter city name..." 
                    class="w-full pl-10 pr-4 py-3 bg-slate-700/70 border border-slate-600 rounded-2xl focus:outline-none focus:ring-2 focus:ring-sky-400 text-sm font-medium text-white placeholder-slate-400 transition-all"
                    required
                />
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400"></i>
            </div>
            <button 
                type="submit" 
                class="bg-sky-500 hover:bg-sky-600 text-white font-semibold px-5 py-3 rounded-2xl transition-all shadow-lg active:scale-95 flex items-center justify-center"
            >
                Search
            </button>
        </form>

        <!-- Loading State Spinner -->
        <div id="loadingState" class="hidden flex-col items-center justify-center py-10">
            <div class="w-10 h-10 border-4 border-sky-400/30 border-t-sky-400 rounded-full animate-spin mb-3"></div>
            <p class="text-xs font-medium text-slate-400">Fetching live weather data...</p>
        </div>

        <!-- Error Alert Message -->
        <div id="errorMessage" class="hidden bg-red-500/10 border border-red-500/30 text-red-300 text-sm p-4 rounded-2xl mb-4 text-center">
            <i class="fa-solid fa-circle-exclamation mr-1.5"></i> <span id="errorText">City not found. Please try again.</span>
        </div>

        <!-- Weather Info Display Output -->
        <div id="weatherDisplay" class="hidden text-center space-y-6">
            
            <!-- City & Date -->
            <div>
                <h2 id="cityName" class="text-2xl font-bold text-white tracking-tight">--</h2>
                <p id="currentDate" class="text-xs text-slate-400 mt-1">--</p>
            </div>

            <!-- Temperature & Condition -->
            <div class="flex flex-col items-center justify-center py-2">
                <img id="weatherIcon" src="" alt="Weather Icon" class="w-24 h-24 drop-shadow-lg" />
                <div id="temperature" class="text-5xl font-extrabold text-white tracking-tight">--°C</div>
                <p id="weatherCondition" class="text-sm font-semibold text-sky-400 capitalize mt-1">--</p>
            </div>

            <!-- Additional Detail Cards: Humidity & Wind -->
            <div class="grid grid-cols-2 gap-3 pt-2">
                <!-- Humidity Card -->
                <div class="bg-slate-700/40 p-3.5 rounded-2xl border border-slate-700 flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-sky-500/10 flex items-center justify-center text-sky-400">
                        <i class="fa-solid fa-droplet text-lg"></i>
                    </div>
                    <div class="text-left">
                        <p class="text-[11px] font-medium text-slate-400">Humidity</p>
                        <p id="humidity" class="text-base font-bold text-white">--%</p>
                    </div>
                </div>

                <!-- Wind Speed Card -->
                <div class="bg-slate-700/40 p-3.5 rounded-2xl border border-slate-700 flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-sky-500/10 flex items-center justify-center text-sky-400">
                        <i class="fa-solid fa-wind text-lg"></i>
                    </div>
                    <div class="text-left">
                        <p class="text-[11px] font-medium text-slate-400">Wind Speed</p>
                        <p id="windSpeed" class="text-base font-bold text-white">-- m/s</p>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <!-- JavaScript logic using Fetch API -->
    <script>
        // OpenWeatherMap API Key
        const API_KEY = '8eb1393b6d668d131a54b13a88c0cac6';
        const DEFAULT_CITY = 'Erode';

        // Load default city on window load
        window.onload = function() {
            fetchWeather(DEFAULT_CITY);
        };

        // Form Submission handler
        function handleSearch(event) {
            event.preventDefault();
            const city = document.getElementById('cityInput').value.trim();
            if (city) {
                fetchWeather(city);
            }
        }

        // Fetch API request to OpenWeatherMap
        async function fetchWeather(city) {
            showLoading();
            const url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&units=metric&appid=${API_KEY}`;

            try {
                const response = await fetch(url);
                if (!response.ok) {
                    if (response.status === 404) {
                        throw new Error("City not found. Please check spelling and try again.");
                    } else if (response.status === 401) {
                        throw new Error("Invalid API Key provided.");
                    } else {
                        throw new Error("Failed to load weather data. Please try again.");
                    }
                }

                const data = await response.json();
                
                // Parse and render weather info
                updateUI({
                    city: `${data.name}, ${data.sys.country}`,
                    temp: Math.round(data.main.temp),
                    humidity: data.main.humidity,
                    condition: data.weather[0].description,
                    iconCode: data.weather[0].icon,
                    windSpeed: data.wind.speed
                });

            } catch (error) {
                showError(error.message || "Network error. Please check your connection.");
            }
        }

        // Update DOM elements
        function updateUI(data) {
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('errorMessage').classList.add('hidden');

            document.getElementById('cityName').innerText = data.city;
            document.getElementById('currentDate').innerText = new Date().toLocaleDateString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });

            document.getElementById('temperature').innerText = `${data.temp}°C`;
            document.getElementById('humidity').innerText = `${data.humidity}%`;
            document.getElementById('weatherCondition').innerText = data.condition;
            document.getElementById('windSpeed').innerText = `${data.windSpeed} m/s`;

            // OpenWeatherMap condition icon
            const iconImg = document.getElementById('weatherIcon');
            iconImg.src = `https://openweathermap.org/img/wn/${data.iconCode}@2x.png`;
            iconImg.alt = data.condition;

            document.getElementById('weatherDisplay').classList.remove('hidden');
        }

        // UI state management functions
        function showLoading() {
            document.getElementById('weatherDisplay').classList.add('hidden');
            document.getElementById('errorMessage').classList.add('hidden');
            document.getElementById('loadingState').classList.remove('hidden');
        }

        function showError(message) {
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('weatherDisplay').classList.add('hidden');
            document.getElementById('errorText').innerText = message;
            document.getElementById('errorMessage').classList.remove('hidden');
        }
    </script>
</body>
</html>
